<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Blogify</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">Blog<span>ify</span></div>
            <p class="auth-sub">Sign in to write and manage your posts</p>

            <div id="alertBox"></div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control"
                    placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control"
                    placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn btn-primary btn-full" id="loginBtn"
                onclick="handleLogin()">
                Sign In
            </button>

            <p style="text-align:center;margin-top:1.25rem;font-size:0.82rem;color:var(--muted);">
                Don't have an account?
                <a href="register.html" style="color:var(--accent);">Register</a>
            </p>
            <p style="text-align:center;margin-top:0.5rem;font-size:0.8rem;">
                <a href="index.html" style="color:var(--muted);">← Back to Blog</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Already logged in — go home
        if (isLoggedIn()) window.location.href = "index.html";

        document.addEventListener("keydown", e => {
            if (e.key === "Enter") handleLogin();
        });

        async function handleLogin() {
            const email    = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const alertBox = document.getElementById("alertBox");
            const btn      = document.getElementById("loginBtn");

            alertBox.innerHTML = "";

            if (!email || !password) {
                alertBox.innerHTML = '<div class="alert alert-error">Please fill in both fields.</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const res  = await apiFetch("/user/signin", {
                    method: "POST",
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.innerHTML = `<div class="alert alert-error">${data.error || "Invalid credentials."}</div>`;
                    btn.disabled = false;
                    btn.textContent = "Sign In";
                    return;
                }

                localStorage.setItem("blogify_user", JSON.stringify(data.user));
                localStorage.setItem("blogify_token", data.token);
                
                // Redirect based on role
                if (data.user?.role === "ADMIN") {
                    window.location.href = "admin/dashboard.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (e) {
                alertBox.innerHTML = '<div class="alert alert-error">Connection failed. Is backend running?</div>';
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
