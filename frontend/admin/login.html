<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Blogify</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">Blog<span>ify</span></div>
      <p class="auth-sub">Admin Panel — Sign in to continue</p>

      <div id="alertBox"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn" onclick="handleLogin()">Sign In</button>

      <p style="text-align:center; margin-top:1.25rem; font-size:0.8rem; color:var(--muted)">
        <a href="../index.html" style="color:var(--accent)">← Back to Blog</a>
      </p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) window.location.href = "dashboard.html";

    // Allow Enter key to submit
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const alert = document.getElementById("alertBox");

      alert.innerHTML = "";

      if (!email || !password) {
        alert.innerHTML = '<div class="alert alert-error">Please fill in both fields.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const res = await apiFetch("/user/signin", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          alert.innerHTML = `<div class="alert alert-error">${data.error || "Invalid credentials."}</div>`;
          btn.disabled = false; btn.textContent = "Sign In";
          return;
        }

        // Save user info to localStorage
        localStorage.setItem("blogify_user", JSON.stringify(data.user));
        window.location.href = "dashboard.html";

      } catch (e) {
        alert.innerHTML = '<div class="alert alert-error">Connection failed. Is backend running?</div>';
        btn.disabled = false; btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
