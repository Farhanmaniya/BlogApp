<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Blogify Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">Blog<span>ify</span> <span style="font-family:var(--mono);font-size:0.62rem;color:var(--muted);font-weight:400;letter-spacing:0.1em;">ADMIN</span></div>
    <ul class="nav-links">
      <li><a href="#" onclick="showView('dashboard')">Dashboard</a></li>
      <li><a href="#" onclick="showView('posts')">Posts</a></li>
      <li><a href="#" onclick="showView('create')">New Post</a></li>
    </ul>
    <div class="nav-right">
      <span id="welcomeUser" style="font-size:0.82rem;color:var(--muted);"></span>
      <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="admin-wrap">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-label">Menu</div>
      <ul class="sidebar-nav">
        <li><a href="#" onclick="showView('dashboard')" id="nav-dashboard" class="active">📊 Dashboard</a></li>
        <li><a href="#" onclick="showView('posts')"     id="nav-posts">📝 All Posts</a></li>
        <li><a href="#" onclick="showView('create')"    id="nav-create">✍️ New Post</a></li>
        <li><a href="#" onclick="showView('edit')"      id="nav-edit" style="display:none;">✏️ Edit Post</a></li>
        <li style="margin-top:2rem;">
          <a href="../index.html" target="_blank">🌐 View Blog</a>
        </li>
      </ul>
    </aside>

    <main class="admin-main">

      <!-- DASHBOARD VIEW -->
      <div id="view-dashboard">
        <div class="admin-topbar">
          <h1>Dashboard</h1>
          <button class="btn btn-primary" onclick="showView('create')">+ New Post</button>
        </div>
        <div class="stats">
          <div class="stat-card">
            <div class="stat-lbl">Total Posts</div>
            <div class="stat-num" id="statTotal">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">This Month</div>
            <div class="stat-num" id="statMonth">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Total Views</div>
            <div class="stat-num" id="statViews">—</div>
          </div>
        </div>
        <div class="table-card">
          <div class="table-card-head">
            <h3>Recent Posts</h3>
          </div>
          <div id="dashTable"><div class="loading">Loading</div></div>
        </div>
      </div>

      <!-- ALL POSTS VIEW -->
      <div id="view-posts" style="display:none;">
        <div class="admin-topbar">
          <h1>All Posts</h1>
          <button class="btn btn-primary" onclick="showView('create')">+ New Post</button>
        </div>
        <div class="table-card">
          <div id="postsTable"><div class="loading">Loading</div></div>
        </div>
      </div>

      <!-- CREATE POST VIEW -->
      <div id="view-create" style="display:none;">
        <div class="admin-topbar"><h1>New Post</h1></div>
        <div class="create-card">
          <div id="createAlert"></div>
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" id="postTitle" class="form-control" placeholder="Enter a compelling title...">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" id="postCategory" class="form-control" placeholder="e.g. Node.js, Backend, Tutorial">
          </div>
          <div class="form-group">
            <label class="form-label">Excerpt (short summary)</label>
            <input type="text" id="postExcerpt" class="form-control" placeholder="One sentence summary shown on homepage...">
          </div>
          <div class="form-group">
            <label class="form-label">Cover Image (optional)</label>
            <input type="file" id="coverImageFile" class="form-control" accept="image/*" onchange="previewImg(this,'imgPreview')">
            <img id="imgPreview" class="img-preview" alt="Preview">
          </div>
          <div class="form-group">
            <label class="form-label">Content *</label>
            <textarea id="postBody" class="form-control" placeholder="Write your post content here...&#10;&#10;Each paragraph on a new line."></textarea>
          </div>
          <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1rem;">
            <button class="btn btn-ghost" onclick="clearCreateForm()">Clear</button>
            <button class="btn btn-primary" id="publishBtn" onclick="createPost()">Publish Post</button>
          </div>
        </div>
      </div>

      <!-- ✅ EDIT POST VIEW -->
      <div id="view-edit" style="display:none;">
        <div class="admin-topbar">
          <h1>Edit Post</h1>
          <button class="btn btn-ghost" onclick="showView('posts')">← Back to Posts</button>
        </div>
        <div class="create-card">
          <div id="editAlert"></div>
          <input type="hidden" id="editPostId">
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" id="editTitle" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" id="editCategory" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Excerpt</label>
            <input type="text" id="editExcerpt" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Content *</label>
            <textarea id="editBody" class="form-control"></textarea>
          </div>
          <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1rem;">
            <button class="btn btn-ghost" onclick="showView('posts')">Cancel</button>
            <button class="btn btn-primary" id="updateBtn" onclick="updatePost()">Save Changes</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="../js/config.js"></script>
  <script>
    // ── Auth guard ───────────────────────────────────────────────────────
    if (!isLoggedIn()) window.location.href = "login.html";
    const user = getUser();
    document.getElementById("welcomeUser").textContent = `Hi, ${user?.fullName || "Admin"}`;

    // ── View switching ───────────────────────────────────────────────────
    const views = ["dashboard","posts","create","edit"];
    function showView(name) {
      views.forEach(v => {
        document.getElementById(`view-${v}`).style.display = v === name ? "block" : "none";
        const nav = document.getElementById(`nav-${v}`);
        if (nav) nav.classList.toggle("active", v === name);
      });
      if (name === "dashboard") loadDashboard();
      if (name === "posts")     loadAllPosts();
    }

    // ── Load Dashboard ───────────────────────────────────────────────────
    async function loadDashboard() {
      try {
        const res  = await apiFetch("/api/blog?page=1&limit=100");
        const data = await res.json();
        if (!data.success) return;

        const blogs    = data.blogs;
        const now      = new Date();
        const thisMonth = blogs.filter(b => {
          const d = new Date(b.createdAt);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
        const totalViews = blogs.reduce((sum, b) => sum + (b.views || 0), 0);

        document.getElementById("statTotal").textContent  = data.total || blogs.length;
        document.getElementById("statMonth").textContent  = thisMonth.length;
        document.getElementById("statViews").textContent  = totalViews;

        renderTable(blogs.slice(0, 5), "dashTable");
      } catch (e) {
        document.getElementById("dashTable").innerHTML =
          '<div class="alert alert-error" style="margin:1rem">Failed to load.</div>';
      }
    }

    // ── Load All Posts ───────────────────────────────────────────────────
    async function loadAllPosts() {
      document.getElementById("postsTable").innerHTML = '<div class="loading">Loading</div>';
      try {
        const res  = await apiFetch("/api/blog?page=1&limit=100");
        const data = await res.json();
        if (!data.success) return;
        renderTable(data.blogs, "postsTable");
      } catch (e) {
        document.getElementById("postsTable").innerHTML =
          '<div class="alert alert-error" style="margin:1rem">Failed to load.</div>';
      }
    }

    // ── Render Table ─────────────────────────────────────────────────────
    function renderTable(blogs, containerId) {
      const wrap = document.getElementById(containerId);
      if (!blogs?.length) {
        wrap.innerHTML = '<div class="empty" style="padding:2rem"><h3>No posts yet</h3><p>Create your first post.</p></div>';
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th><th>Title</th><th>Category</th><th>Views</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${blogs.map((b, i) => `
              <tr>
                <td style="color:var(--muted);font-family:var(--mono);font-size:0.73rem;">${i+1}</td>
                <td><strong>${b.title}</strong></td>
                <td>${b.category ? `<span class="badge badge-pub">${b.category}</span>` : '<span class="badge badge-draft">None</span>'}</td>
                <td style="font-family:var(--mono);font-size:0.8rem;">${b.views || 0}</td>
                <td style="font-family:var(--mono);font-size:0.73rem;">${formatDate(b.createdAt)}</td>
                <td>
                  <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                    <a href="../post.html?id=${b._id}" target="_blank" class="btn btn-ghost" style="font-size:0.72rem;padding:0.25rem 0.6rem;">View</a>
                    <button class="btn btn-success-sm" style="font-size:0.72rem;padding:0.25rem 0.6rem;" onclick="openEdit('${b._id}','${b.title.replace(/'/g,"\\'")}',\`${b.body.replace(/`/g,"\\`")}\`,'${b.category||""}','${b.excerpt||""}')">Edit</button>
                    <button class="btn btn-danger"    style="font-size:0.72rem;padding:0.25rem 0.6rem;" onclick="deletePost('${b._id}',this)">Delete</button>
                  </div>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }

    // ── Open Edit Form ────────────────────────────────────────────────────
    function openEdit(id, title, body, category, excerpt) {
      document.getElementById("editPostId").value   = id;
      document.getElementById("editTitle").value    = title;
      document.getElementById("editBody").value     = body;
      document.getElementById("editCategory").value = category;
      document.getElementById("editExcerpt").value  = excerpt;
      document.getElementById("editAlert").innerHTML = "";
      document.getElementById("nav-edit").style.display = "flex";
      showView("edit");
    }

    // ── Update Post ───────────────────────────────────────────────────────
    async function updatePost() {
      const id       = document.getElementById("editPostId").value;
      const title    = document.getElementById("editTitle").value.trim();
      const body     = document.getElementById("editBody").value.trim();
      const category = document.getElementById("editCategory").value.trim();
      const excerpt  = document.getElementById("editExcerpt").value.trim();
      const alertBox = document.getElementById("editAlert");
      const btn      = document.getElementById("updateBtn");

      alertBox.innerHTML = "";
      if (!title || !body) {
        alertBox.innerHTML = '<div class="alert alert-error">Title and content are required.</div>';
        return;
      }

      btn.disabled = true; btn.textContent = "Saving...";

      try {
        const res  = await apiFetch(`/api/blog/${id}`, {
          method: "PUT",
          body: JSON.stringify({ title, body, category, excerpt }),
        });
        const data = await res.json();
        if (data.success) {
          alertBox.innerHTML = '<div class="alert alert-success">✅ Post updated successfully!</div>';
          setTimeout(() => showView("posts"), 1200);
        } else {
          alertBox.innerHTML = `<div class="alert alert-error">${data.message || "Update failed."}</div>`;
        }
      } catch (e) {
        alertBox.innerHTML = '<div class="alert alert-error">Network error.</div>';
      }
      btn.disabled = false; btn.textContent = "Save Changes";
    }

    // ── Delete Post ───────────────────────────────────────────────────────
    async function deletePost(id, btn) {
      if (!confirm("Delete this post? This cannot be undone.")) return;
      btn.disabled = true; btn.textContent = "...";
      try {
        const res  = await apiFetch(`/api/blog/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (data.success) {
          loadDashboard(); loadAllPosts();
        } else {
          alert("Delete failed: " + (data.message || "Unknown error"));
          btn.disabled = false; btn.textContent = "Delete";
        }
      } catch (e) {
        alert("Network error");
        btn.disabled = false; btn.textContent = "Delete";
      }
    }

    // ── Create Post ───────────────────────────────────────────────────────
    async function createPost() {
      const title    = document.getElementById("postTitle").value.trim();
      const body     = document.getElementById("postBody").value.trim();
      const category = document.getElementById("postCategory").value.trim();
      const excerpt  = document.getElementById("postExcerpt").value.trim();
      const file     = document.getElementById("coverImageFile").files[0];
      const alertBox = document.getElementById("createAlert");
      const btn      = document.getElementById("publishBtn");

      alertBox.innerHTML = "";
      if (!title || !body) {
        alertBox.innerHTML = '<div class="alert alert-error">Title and content are required.</div>';
        return;
      }

      btn.disabled = true; btn.textContent = "Publishing...";

      try {
        let res;
        if (file) {
          const formData = new FormData();
          formData.append("title",    title);
          formData.append("body",     body);
          formData.append("category", category);
          formData.append("excerpt",  excerpt);
          formData.append("coverImage", file);
          res = await apiFetchForm("/api/blog/create", formData);
        } else {
          res = await apiFetch("/api/blog/create", {
            method: "POST",
            body: JSON.stringify({ title, body, category, excerpt }),
          });
        }

        const data = await res.json();
        if (data.success) {
          alertBox.innerHTML = '<div class="alert alert-success">✅ Post published successfully!</div>';
          clearCreateForm();
          setTimeout(() => showView("posts"), 1500);
        } else {
          alertBox.innerHTML = `<div class="alert alert-error">${data.message || "Failed."}</div>`;
        }
      } catch (e) {
        alertBox.innerHTML = '<div class="alert alert-error">Network error. Is backend running?</div>';
      }
      btn.disabled = false; btn.textContent = "Publish Post";
    }

    // ── Helpers ───────────────────────────────────────────────────────────
    function clearCreateForm() {
      ["postTitle","postBody","postCategory","postExcerpt"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("coverImageFile").value = "";
      document.getElementById("imgPreview").style.display = "none";
      document.getElementById("createAlert").innerHTML = "";
    }

    function previewImg(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files?.[0]) {
        preview.src = URL.createObjectURL(input.files[0]);
        preview.style.display = "block";
      }
    }

    async function handleLogout() {
      if (confirm("Logout from admin panel?")) await logout();
    }

    // ── Init ──────────────────────────────────────────────────────────────
    loadDashboard();
  </script>
</body>
</html>
